# Docker Compose del launcher con microservicios y bases de datos PostgreSQL dedicadas.
services:
  nats-server:
    image: nats:latest
    ports:
      - "8222:8222"

  gateway-ms-dev:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - ${GATEWAY_PORT}:3000
    volumes:
      - ./gateway/src:/usr/src/app/src
    command: pnpm run start:dev
    depends_on:
      - nats-server
    restart: unless-stopped
    environment:
      - PORT=3000
      - NATS_SERVERS=nats://nats-server:4222

  users-ms-dev:
    build:
      context: ./users-microservice
      dockerfile: Dockerfile
    depends_on:
      - nats-server
    volumes:
      - ./users-microservice/src:/usr/src/app/src
    command: pnpm run start:dev
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://raunogroch-pg:Passw0rd.3315@192.168.100.28:5432/usuariosdb-dev
      - NATS_SERVERS=nats://nats-server:4222
      - JWT_SECRET=EsT0D3betterTh4nThis

  assignments-ms-dev:
    build:
      context: ./assignments-microservice
      dockerfile: Dockerfile
    depends_on:
      - nats-server
    volumes:
      - ./assignments-microservice/src:/usr/src/app/src
    command: pnpm run start:dev
    restart: unless-stopped
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://raunogroch-pg:Passw0rd.3315@192.168.100.28:5432/assignmentsdb-dev
      - NATS_SERVERS=nats://nats-server:4222

  clubs-ms-dev:
    build:
      context: ./clubs-microservice
      dockerfile: Dockerfile
    depends_on:
      - nats-server
    volumes:
      - ./clubs-microservice/src:/usr/src/app/src
    command: pnpm run start:dev
    restart: unless-stopped
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://raunogroch-pg:Passw0rd.3315@192.168.100.28:5432/clubsdb-dev
      - NATS_SERVERS=nats://nats-server:4222

  groups-ms-dev:
    build:
      context: ./groups-microservice
      dockerfile: Dockerfile
    depends_on:
      - nats-server
